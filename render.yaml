# Render Blueprint — free web service.
# Note: Render free web services sleep after 15 min idle; the repo's
# .github/workflows/keepalive.yml pings /health every 5 min to keep it awake.
services:
  - type: web
    name: telegram-rdp-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false        # fill in the dashboard
      - key: ALLOWED_USERS
        sync: false        # your Telegram user ID(s), comma separated
      - key: RDP_HOST
        sync: false        # optional — /connect asks for it anyway
      - key: RDP_PORT
        value: "3389"
      - key: RDP_USER
        sync: false
      - key: RDP_PASS
        sync: false
      - key: RDP_WIDTH
        value: "1366"
      - key: RDP_HEIGHT
        value: "768"
      - key: CAPTURE_FPS
        value: "5"
      - key: TYPE_CPS
        value: "12"
