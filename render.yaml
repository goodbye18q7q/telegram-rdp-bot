# Render Blueprint — free web service.
# Note: Render free web services sleep after 15 min idle; the repo's
# .github/workflows/keepalive.yml pings /health every 5 min to keep it awake.
services:
  - type: web
    name: telegram-rdp-bot
    runtime: python
    plan: free
    buildCommand: |
      (sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick x11-utils freerdp3-x11 freerdp2-x11 || apt-get update && apt-get install -y xvfb xdotool imagemagick x11-utils freerdp3-x11 freerdp2-x11 || sudo apt-get update && sudo apt-get install -y xvfb xfreerdp3 xdotool imagemagick x11-utils || apt-get update && apt-get install -y xvfb xfreerdp3 xdotool imagemagick x11-utils) || echo "apt fallback warning"
      pip install -r requirements.txt
    startCommand: Xvfb :99 -screen 0 1366x768x24 > /tmp/xvfb.log 2>&1 & python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false        # fill in the dashboard
      - key: ALLOWED_USERS
        sync: false        # your Telegram user ID(s), comma separated
      - key: RDP_HOST
        sync: false        # optional — /connect asks for it anyway
      - key: RDP_PORT
        value: "3389"
      - key: RDP_USER
        sync: false
      - key: RDP_PASS
        sync: false
      - key: RDP_WIDTH
        value: "1366"
      - key: RDP_HEIGHT
        value: "768"
      - key: CAPTURE_FPS
        value: "5"
      - key: TYPE_CPS
        value: "12"
